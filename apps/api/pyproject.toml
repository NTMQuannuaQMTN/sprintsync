[project]
name = "sprintsync-api"
version = "0.1.0"
description = "SprintSync AI — FastAPI Backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin to ruff's traditional flake8-equivalent baseline (real bugs: syntax
# errors, undefined names, unused imports) rather than whatever the locally
# installed ruff version defaults to — pyupgrade/bandit/isort/bugbear rules
# are not enabled here, since applying them retroactively would mean
# reformatting the entire pre-existing codebase for style, not fixing bugs.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
