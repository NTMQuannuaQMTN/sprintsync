[project]
name = "sprintsync-api"
version = "0.1.0"
description = "SprintSync AI — FastAPI Backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin to ruff's traditional flake8-equivalent baseline (real bugs: syntax
# errors, undefined names, unused imports) rather than whatever the locally
# installed ruff version defaults to — pyupgrade/bandit/isort/bugbear rules
# are not enabled here, since applying them retroactively would mean
# reformatting the entire pre-existing codebase for style, not fixing bugs.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The DB-integration tests (test_auth_integration.py) share one module-level
# SQLAlchemy async engine (src/core/database.py) across many tests. A
# per-test event loop (pytest-asyncio's default) leaves pooled connections
# bound to a loop that's already closed by the time the next test runs
# ("Task ... got Future ... attached to a different loop"). One event loop
# for the whole session avoids that; it doesn't affect the pure-unit tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
